<h1>Login</h1>
<hr>
<div class="col-md-4">
    <form #loginForm="ngForm" (ngSubmit)="login(loginForm)" autocomplete="off" novalidate>
        <div class="form-group">
            <label for="userName">User Name:</label>
            <em *ngIf="loginForm.controls['userName']?.invalid && (loginForm.controls['userName']?.touched || mouseOverLogin )" > Username is required</em>
            <input id="userName" (ngModel)="user?.userName" name="userName"  type="text" class="form-control" placeholder="User Name..." required />
        </div>
        <div class="form-group">
            <label for="password">PassWord:</label>
            <em *ngIf="loginForm.controls['password']?.invalid && (loginForm.controls['password']?.touched || mouseOverLogin)">Password is required</em>
            <input id="password" (ngModel)="user?.password"  name="password" type="password" class="form-control" placeholder="Password..." required/>
        </div>
        <button type="submit" (mouseenter)="mouseOverLogin = true" (mouseleave)="mouseOverLogin = false" class="btn btn-primary" [disabled]="loginForm.invalid">login</button>&nbsp;
        <button type="button" (click)="cancel()" class="btn btn-default">canel</button>
    </form>
</div>
