<div class="col-md-12">
    <h3>Create Session</h3>
</div>
<div class="col-md-6">
    <form [formGroup]="sessionForm!" autocomplete="off"  (ngSubmit)="saveSession(sessionForm?.value)">
        <div class="form-group">
            <label for="sessionName">SessionName: </label>
            <em *ngIf="(name?.invalid ) && name?.touched">Name is Required</em>
            <input name="sessionName" [ngClass]="{'error': name?.invalid || name?.dirty }" type="text" formControlName="name" class="form-control" placeholder="session name..."/>
        </div>
        <div class="form-group">
            <label for="presenter">Presenter: </label>
            <em *ngIf="(presenter?.invalid) && presenter?.touched">Presenter is Requried</em>
            <input id="presenter" name="presenter" [ngClass]="{'error': presenter?.invalid||presenter?.dirty}" formControlName="presenter" class="form-control" placeholder="session presenter..." />
        </div>
        <div class="form-group">
            <label for="duration">Duration: </label>
            <em *ngIf="(duration?.invalid) && duration?.touched">Duration is Requried</em>
            <select id="duration" name="duration" [ngClass]="{'error' : duration?.invalid||duration?.dirty}" formControlName="duration" class="form-control" >
                <option value="">session duration... </option>
                <option value="1" >Half Hour</option>
                <option value="2">1 Hour</option>
                <option value="3">Half Day</option>
                <option value="4">Full Day</option>
                </select>
        </div>
        <div class="form-group">
            <label for="level">Level:</label>
            <em *ngIf="(level?.invalid) && level?.touched">Level is Required</em>
            <select id="level" name="level" [ngClass]="{'error' : level?.invalid||level?.dirty}" formControlName="level" class="form-control">
                <option value="">select level...</option>
                <option value="Beginner">Beginner</option>
                <option value="Intermediate">Intermediate</option>
                <option value="Advanced">Advanced</option>
            </select>
        </div>
        <div class="form-group">
            <label for="abstract">Abstract:</label>
            <em *ngIf="(abstract?.invalid) && abstract?.touched">Abastrat is Requried</em>
            <em *ngIf="(abstract?.invalid|| abstract?.errors?.['maxLength']) && abstract?.touched"> cannot exceed 400 characters</em>
            <textarea id="abstract" name="abstract" [ngClass]="{'error' : abstract?.invalid||abstract?.dirty||abstract?.errors?.['maxLength']}" formControlName="abstract" class="form-control" placeholder="abstract">
                
            </textarea>
        </div>
        <button type="submit" [disabled]="sessionForm?.invalid" class="btn btn-primary">Save</button>&nbsp;
        <button type="button" class="btn btn-default">Cancel</button>
    </form>
</div>
